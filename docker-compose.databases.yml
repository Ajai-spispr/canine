version: "3.2"
services:
  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=canine_development
    ports:
      - "5689:5432"  # Custom port 5689 for PostgreSQL
    volumes:
      - "postgres_dev_data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d canine_development"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      postgres -c log_statement=all
      -c log_destination=stderr
      -c logging_collector=on
      -c log_min_error_statement=error

  redis:
    image: redis:alpine
    ports:
      - "5690:6379"  # Custom port 5690 for Redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

volumes:
  postgres_dev_data: 