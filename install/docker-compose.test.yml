version: "3.2"
services:
  postgres_test:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=canine_test
    ports:
      - "5434:5432"  # Changed from 5433 to 5434 to avoid conflicts
    volumes:
      - "postgres_test:/var/lib/postgresql/data"

  redis_test:
    image: redis:alpine
    ports:
      - "6380:6379"  # Different port to avoid conflicts

volumes:
  postgres_test: 